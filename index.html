<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

<canvas id="c"></canvas>

<div id="hud-coords" class="hud">X:   0.0 Y:   0.0 Z:   0.0</div>
<div id="hud-status" class="hud">● online</div>

<div id="hint">click the gem for details</div>

<div id="about-panel">
  <button id="about-close">✕</button>
  <div id="about-title" style="margin-bottom: 12px;">INFORMATION</div>
  <div id="about-screen"></div>
</div>
<span id="about-ruler">M</span>

<div id="sub-panel">
  <div id="sub-panel-category">artwork</div>
  <div id="sub-panel-title">Title</div>
  <div id="sub-panel-divider"></div>
  <div id="sub-panel-desc">Description</div>
  <div id="sub-panel-items"></div>
</div>

<div id="panel">
  <button id="panel-close">✕</button>
  <div id="panel-category">Category</div>
  <div id="panel-title">Title</div>
  <div id="panel-divider"></div>
  <div id="panel-desc">Description</div>
  <div id="panel-items"></div>
</div>

<!-- 앱 패널 오버레이 -->
<div id="app-overlay"></div>
<div id="app-panel">
  <div id="app-panel-header">
    <span id="app-panel-title">—</span>
    <button id="app-panel-close">✕</button>
  </div>
  <iframe id="app-panel-iframe" src="" allowfullscreen></iframe>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
  }
}
</script>
<script type="module" src="main.js"></script>

</html>
